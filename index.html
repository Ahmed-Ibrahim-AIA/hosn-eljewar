  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="حسن الجوار - إدارة العمارة والمصروفات السكنية" />
    <meta property="og:description" content="تطبيق حسن الجوار المتكامل لتسجيل النقود والمصروفات ومتابعة شقق وسكان العمارة، وإصدار إيصالات القبض والتقارير المالية الشهرية الاحترافية بعدة صيغ." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حسن الجوار" />
    <meta name="application-name" content="حسن الجوار" />
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        try {
          localStorage.setItem('borj_elnoor_pwa_installed', 'true');
        } catch (err) {}
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (key !== 'borj-elnoor-pwa-v14') {
              caches.delete(key).catch(function () {});
            } else {
              caches.open(key).then(function (cache) {
                cache.keys().then(function (requests) {
                  requests.forEach(function (req) {
                    if (
                      req.url.indexOf('/@vite') !== -1 ||
                      req.url.indexOf('/src/') !== -1 ||
                      req.url.indexOf('/node_modules/') !== -1
                    ) {
                      cache.delete(req).catch(function () {});
                    }
                  });
                });
              });
            }
          });
        }).catch(function () {});
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (reg) {
              reg.update().catch(function () {});
              window.dispatchEvent(new CustomEvent('pwa-sw-ready'));
            })
            .catch(function () {});
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white !important;
          color: black !important;
        }
      }
    </style>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
